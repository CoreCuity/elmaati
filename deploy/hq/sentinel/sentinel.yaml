# Sentinel v0 — what the watch checks (docs/architecture/fleet-v1.md §3). Non-LLM: every verdict here is
# a deterministic threshold. Installed root-owned; svc-hermes can read it but not change what it watches.

discord_channel: "1505316048809885807"   # #infra-alerts (see ../fleet-discord.yaml)

# Hosts read through the fleet's forced-command key: ssh fleetwatch@<addr> → fleet-status JSON only.
hosts:
  corecuity-HQ:
    addr: 127.0.0.1
    backups: [hq-offsite-hetzner.service]
  corecuity-clients:
    addr: 161.97.166.112
    backups: [mailcow-backup.service, mailcow-offsite-hetzner.service]
    # Client (tenant) backups run as each client's own systemd user units. fleet-status reads them through
    # the root helper fleet-tenant-backups (one fixed sudo rule, no arguments). Every unit listed here must
    # exist and have succeeded within the age limit; lingering users NOT listed show in the digest.
    tenant_backups:
      adolia: [adolia-backup.service, adolia-odoo-offsite-hetzner.service]
      ajihost: [ajihost-backup.service]              # local only — no off-site copy yet
      odae: [odae-backup.service, odae-offsite-hetzner.service]
      paradisante: [paradisante-backup.service]      # local only — no off-site copy yet
      plane: [plane-backup.service, plane-offsite-hetzner.service]
      # youandco: no backup unit exists (2026-09-28) — open question whether You&Co is still a client

thresholds:
  disk_warn_pct: 85
  disk_crit_pct: 95
  mem_available_min_pct: 10
  # Backups run nightly. Their last success may be up to 24 h (interval) + 4 h (longest allowed run)
  # + 2 h (slack for a late start) old before it is a problem. A backup queued behind another one on
  # the same host is not judged by age at all while the chain is running (see sentinel-check).
  backup_max_run_h: 4       # a backup still running after this long is stuck
  backup_max_age_h: 30
  tls_warn_days: 14
  tls_crit_days: 5
  domain_warn_days: 30     # registration expiry: warn at 30 days, re-alert at 14, critical at 7
  domain_crit_days: 7

# Failed units that are known and harmless on these VPS images (boot-time only).
ignore_failed_units: [systemd-networkd-wait-online.service, cloud-init.service]

# Public endpoints, checked from HQ: HTTPS answers (< 400, redirects and auth walls count as up) + certificate
# expiry. `host/path` checks that path (APIs whose root is a 404 by design).
endpoints:
  - plane.corecuity.com
  - mail.corecuity.com
  - status.corecuity.com
  - mta-sts.corecuity.com/.well-known/mta-sts.txt   # mail MTA-STS policy (root is a 404 by design)
  - monitor.corecuity.com
  - odae.ma
  - www.odae.ma
  - wp.odae.ma
  - adolia.ma
  - adolia.odoobooking.online
  - desirsdorient.com
  - admin.desirsdorient.com
  - paradisante.ma
  - ajihost.ma
  - api.ajihost.ma/api
  - youandco.online              # 2026-09-24: resolves to 198.54.117.242 — not a CoreCuity server
  # rec / rcpt-*: DNS still points at the dead server-architect (84.247.138.95); Caddy serves them on HQ.
  - rcpt-hq.corecuity.com
  - rcpt-desirs.corecuity.com
  - rec.corecuity.com

# Domain registrations, looked up once a day (RDAP; port-43 WHOIS for .ma).
domains:
  - corecuity.com
  - odae.ma
  - adolia.ma
  - desirsdorient.com
  - paradisante.ma
  - ajihost.ma
  - odoobooking.online     # hosts adolia.odoobooking.online — expires 2026-12-12 (checked 2026-09-28)
  - youandco.online        # not our server any more; kept until "is You&Co still a client?" is answered

# Credentials with a known expiry. Alert at 14, 7, 3 and 1 days out, and after expiry.
# Only dates verified at the source (debug_token etc.) belong here.
expiries:
  - name: CoreCuity Meta token (all clients' ad accounts)
    date: 2026-11-27
    action: extend it in the Access Token Debugger, then run clients/Adolia/scripts/swap-meta-token.sh --allow-user on the Mac
