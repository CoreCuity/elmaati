# Sentinel v0 — what the watch checks (docs/architecture/fleet-v1.md §3). Non-LLM: every verdict here is
# a deterministic threshold. Installed root-owned; svc-hermes can read it but not change what it watches.

discord_channel: "1505316048809885807"   # #infra-alerts (see ../fleet-discord.yaml)

# Hosts read through the fleet's forced-command key: ssh fleetwatch@<addr> → fleet-status JSON only.
hosts:
  corecuity-HQ:
    addr: 127.0.0.1
    backups: [hq-offsite-hetzner.service]
  corecuity-clients:
    addr: 161.97.166.112
    backups: [mailcow-backup.service, mailcow-offsite-hetzner.service]
    # Client (tenant) backups run as each client's own systemd user units. fleet-status reads them through
    # the root helper fleet-tenant-backups (one fixed sudo rule, no arguments). Every unit listed here must
    # exist and have succeeded within the age limit; lingering users NOT listed show in the digest.
    tenant_backups:
      adolia: [adolia-backup.service, adolia-odoo-offsite-hetzner.service]
      ajihost: [ajihost-backup.service, ajihost-offsite-hetzner.service]
      odae: [odae-backup.service, odae-offsite-hetzner.service]
      paradisante: [paradisante-backup.service, paradisante-offsite-hetzner.service]
      plane: [plane-backup.service, plane-offsite-hetzner.service]
    # Intentional gaps (Najlaa, 2026-09-28) — kept out of the digest; any OTHER gap still shows there.
    local_only_by_plan: []                      # Massine enabled both off-site copies, 2026-10-15
    not_watched: [youandco]                      # client on hold, no interaction — no backup, no site/domain watch

  # Client servers we don't host but look after (added 2026-09-28). Backups there are not systemd units:
  # fleet-status reads them through fleet-backup-sources (list in elmaati deploy/provision/hosts/<name>.json).
  desirs:
    addr: 46.224.31.181                 # Désirs d'Orient Odoo (Hetzner)
    backup_sources: [desirs-odoo-prod]  # nightly 02:00 cron → Storage Box
  majormedia:
    addr: ns1.majormedia.marketing      # cPanel host of adolia.ma (WooCommerce)
    backup_sources: all                 # every enabled JetBackup 5 job, each against its own schedule

thresholds:
  disk_warn_pct: 85
  disk_crit_pct: 95
  mem_available_min_pct: 10
  # Backups run nightly. Their last success may be up to 24 h (interval) + 4 h (longest allowed run)
  # + 2 h (slack for a late start) old before it is a problem. A backup queued behind another one on
  # the same host is not judged by age at all while the chain is running (see sentinel-check).
  backup_max_run_h: 4       # a backup still running after this long is stuck
  backup_max_age_h: 30
  tls_warn_days: 14
  tls_crit_days: 5
  domain_warn_days: 30     # registration expiry: warn at 30 days, re-alert at 14, critical at 7
  domain_crit_days: 7

# Failed units that are known and harmless on these VPS images (boot-time only).
ignore_failed_units: [systemd-networkd-wait-online.service, cloud-init.service]

# Public endpoints, checked from HQ: HTTPS answers (< 400, redirects and auth walls count as up) + certificate
# expiry. `host/path` checks that path (APIs whose root is a 404 by design).
endpoints:
  - corecuity.com                # holding page on corecuity-HQ (deploy/hq/caddy), since 2026-09-28
  - www.corecuity.com
  - plane.corecuity.com
  - mail.corecuity.com
  - status.corecuity.com
  - mta-sts.corecuity.com/.well-known/mta-sts.txt   # mail MTA-STS policy (root is a 404 by design)
  - monitor.corecuity.com
  - odae.ma
  - www.odae.ma
  - wp.odae.ma
  - adolia.ma
  - adolia.odoobooking.online
  - desirsdorient.com
  - admin.desirsdorient.com
  - paradisante.ma
  - ajihost.ma
  - api.ajihost.ma/api/v1/health   # Swagger /api is disabled in production; probe the actual health route

# Where each proxied (orange-cloud) site really lives. Visitors reach it through Cloudflare, which renews its
# own edge certificate — so the certificate check reads the ORIGIN's certificate from these IPs instead.
origins:
  161.97.166.112: [plane.corecuity.com, status.corecuity.com, monitor.corecuity.com, odae.ma, www.odae.ma,
                   wp.odae.ma, adolia.odoobooking.online, paradisante.ma, ajihost.ma, api.ajihost.ma]
  169.58.195.92: [corecuity.com, www.corecuity.com]

# Storefronts, end to end (every run): the WooCommerce Store API lists products, a live product page shows
# the price the API reports, and the cart backend answers. product_url: the storefront's page for a slug
# (omit to use WooCommerce's own permalink).
shops:
  - name: odae.ma
    api: https://wp.odae.ma
    product_url: https://odae.ma/fr/store/{slug}     # headless storefront, fed by wp.odae.ma
  - name: adolia.ma
    api: https://adolia.ma

# Sites without a shop: the landing page must contain this text and no error/maintenance page.
content:
  desirsdorient.com: "Desirs d"
  paradisante.ma: "Paradisante"
  ajihost.ma: "Ajihost"

# Domain registrations, looked up once a day (RDAP; port-43 WHOIS for .ma).
domains:
  - corecuity.com
  - odae.ma
  - adolia.ma
  - desirsdorient.com
  - paradisante.ma
  - ajihost.ma
  - odoobooking.online     # hosts adolia.odoobooking.online — expires 2026-12-12 (checked 2026-09-28)

# Items with a known expiry/sunset. Alert at 14, 7, 3 and 1 days out, and after expiry.
# Only dates verified at the source (debug_token etc.) belong here.
expiries:
  - name: CoreCuity Meta token (all clients' ad accounts)
    date: 2026-11-27
    action: extend it in the Access Token Debugger, then run clients/Adolia/scripts/swap-meta-token.sh --allow-user on the Mac
  - name: Gemini 3.6 / 3.7 models deprecation & intro pricing expiry
    date: 2026-12-31
    action: prune retired gemini-3.6-* and gemini-3.7-* models from core/ai-router registry.mjs
