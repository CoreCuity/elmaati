# Sentinel v0 — what the watch checks (docs/architecture/fleet-v1.md §3). Non-LLM: every verdict here is
# a deterministic threshold. Installed root-owned; svc-hermes can read it but not change what it watches.

discord_channel: "1505316048809885807"   # #infra-alerts (see ../fleet-discord.yaml)

# Hosts read through the fleet's forced-command key: ssh fleetwatch@<addr> → fleet-status JSON only.
hosts:
  corecuity-HQ:
    addr: 127.0.0.1
    backups: [hq-offsite-hetzner.service]
  corecuity-clients:
    addr: 161.97.166.112
    backups: [mailcow-backup.service, mailcow-offsite-hetzner.service]
    # Tenant backups (adolia-odoo, plane, odae, …) run as rootless user units that fleetwatch cannot see.
    # Not watched yet — listed in the daily digest as a known gap.

thresholds:
  disk_warn_pct: 85
  disk_crit_pct: 95
  mem_available_min_pct: 10
  # Backups run nightly. Their last success may be up to 24 h (interval) + 4 h (longest allowed run)
  # + 2 h (slack for a late start) old before it is a problem. A backup queued behind another one on
  # the same host is not judged by age at all while the chain is running (see sentinel-check).
  backup_max_run_h: 4       # a backup still running after this long is stuck
  backup_max_age_h: 30
  tls_warn_days: 14
  tls_crit_days: 5

# Failed units that are known and harmless on these VPS images (boot-time only).
ignore_failed_units: [systemd-networkd-wait-online.service, cloud-init.service]

# Public endpoints, checked from HQ: HTTPS answers (< 400, redirects and auth walls count as up) + certificate
# expiry. `host/path` checks that path (APIs whose root is a 404 by design).
endpoints:
  - plane.corecuity.com
  - mail.corecuity.com
  - status.corecuity.com
  - mta-sts.corecuity.com/.well-known/mta-sts.txt   # mail MTA-STS policy (root is a 404 by design)
  - monitor.corecuity.com
  - odae.ma
  - www.odae.ma
  - wp.odae.ma
  - adolia.ma
  - adolia.odoobooking.online
  - desirsdorient.com
  - admin.desirsdorient.com
  - paradisante.ma
  - ajihost.ma
  - api.ajihost.ma/api
  - youandco.online              # 2026-09-24: resolves to 198.54.117.242 — not a CoreCuity server
  # rec / rcpt-*: DNS still points at the dead server-architect (84.247.138.95); Caddy serves them on HQ.
  - rcpt-hq.corecuity.com
  - rcpt-desirs.corecuity.com
  - rec.corecuity.com

# Credentials with a known expiry. Alert at 14, 7, 3 and 1 days out, and after expiry.
# Only dates that were verified at the source belong here. CoreCuity's Meta user token (app "CoreCuity Ads",
# sees every client's ad account; stored in .secrets/meta-ads.env on the Mac) is NOT listed: debug_token
# (2026-09-24) shows expires_at = 0, so it has no hard expiry. Its data_access_expires_at is a rolling 90-day
# window that renews with use, not a deadline. It dies on a password change or revocation instead, and the
# fleet holds no Meta credential to probe that (fleet-v1 §6.3).
expiries: []
